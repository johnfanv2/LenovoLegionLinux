[main]
# enable fancurve-control
fan_control=true
# enable cpu_control
cpu_control=false
# write the firmware's per-mode CPU power limits (PL1/PL2) to the MMIO RAPL
# limit on every power profile change. For firmware that leaves the non-custom
# modes to OEM software on Windows (e.g. Legion Pro 7 16IAX10H: 30 W package
# limit in every mode on Linux). Needs legion-laptop's
# cpu_*_powerlimit_defaults attributes; custom mode is left to the firmware.
# Don't combine with thermald's power-limit control (e.g. thermald
# --adaptive): both write the same MMIO limit.
cpu_powerlimit_sync=false
# set nvidia to enable nvidia support
# set radeon to enable amdgpu support
# set false to disable gpu_control
gpu_control=false
# paths to the GPU control tools (defaults shown below)
#nvidia_smi_path=/opt/bin/nvidia-smi
#rocm_smi_path=/opt/bin/rocm-smi

[gpu_control]
tdp_bat_q=55
tdp_ac_q=80

tdp_bat_b=55
tdp_ac_b=125

tdp_bat_bp=80
tdp_ac_bp=140

tdp_ac_p=140

[cpu_control]
bat_q=ryzenadj --tctl-temp=50
ac_q=ryzenadj --tctl-temp=50

bat_b=ryzenadj --tctl-temp=60
ac_b=ryzenadj --tctl-temp=60

bat_bp=ryzenadj --tctl-temp=70
ac_bp=ryzenadj --tctl-temp=70

ac_p=ryzenadj --tctl-temp=85

[cpu_powerlimit]
# PL1/PL2 in watts on battery for cpu_powerlimit_sync (the firmware publishes
# no battery defaults); leave unset to not touch the limits on battery.
# The 16IAX10H firmware's DPTF DC_Balance target is 45/65.
#bat_pl1=45
#bat_pl2=65

# Combined-load ("double") targets, as the firmware's DPTF policy applies on
# Windows: while both double_sensors (thermal zone types, see
# /sys/class/thermal/thermal_zone*/type) are at or above a mode's
# double_ac_<mode>_temp, cpu_powerlimit_sync uses double_ac_<mode>_pl
# (PL1,PL2 in watts) instead of the firmware's single-load defaults, leaving
# power and cooling for the GPU. It switches back once either sensor is
# double_hysteresis degrees below its threshold; re-checked on every profile
# change and by legiond-cpuset.timer. Values for the Legion Pro 7 16IAX10H
# (Q7CN) from its DPTF data vault (*_Double targets; modes: q quiet, b
# balanced, p performance, e extreme):
#double_sensors=SEN3,SEN4
#double_hysteresis=3
#double_ac_q_pl=40,65
#double_ac_q_temp=50,57
#double_ac_b_pl=60,125
#double_ac_b_temp=50,61
#double_ac_p_pl=75,190
#double_ac_p_temp=54,74
#double_ac_e_pl=105,205
#double_ac_e_temp=54,72
