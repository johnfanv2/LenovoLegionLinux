[main]
# enable fancurve-control
fan_control=true
# enable cpu_control
cpu_control=false
# write the firmware's per-mode CPU power limits (PL1/PL2) to the MMIO RAPL
# limit on every power profile change. For firmware that leaves the non-custom
# modes to OEM software on Windows (e.g. Legion Pro 7 16IAX10H: 30 W package
# limit in every mode on Linux). Needs legion-laptop's
# cpu_*_powerlimit_defaults attributes; custom mode is left to the firmware.
cpu_powerlimit_sync=false
# set nvidia to enable nvidia support
# set radeon to enable amdgpu support
# set false to disable gpu_control
gpu_control=false
# paths to the GPU control tools (defaults shown below)
#nvidia_smi_path=/opt/bin/nvidia-smi
#rocm_smi_path=/opt/bin/rocm-smi

[gpu_control]
tdp_bat_q=55
tdp_ac_q=80

tdp_bat_b=55
tdp_ac_b=125

tdp_bat_bp=80
tdp_ac_bp=140

tdp_ac_p=140

[cpu_control]
bat_q=ryzenadj --tctl-temp=50
ac_q=ryzenadj --tctl-temp=50

bat_b=ryzenadj --tctl-temp=60
ac_b=ryzenadj --tctl-temp=60

bat_bp=ryzenadj --tctl-temp=70
ac_bp=ryzenadj --tctl-temp=70

ac_p=ryzenadj --tctl-temp=85

[cpu_powerlimit]
# PL1/PL2 in watts on battery for cpu_powerlimit_sync (the firmware publishes
# no battery defaults); leave unset to not touch the limits on battery.
# The 16IAX10H firmware's DPTF DC_Balance target is 45/65.
#bat_pl1=45
#bat_pl2=65
