name: Build PR
run-name: ${{ github.actor }} running Build PR
on:
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: ./deploy/dependencies/install_dependencies_ubuntu_24_04.sh
      shell: bash
    - name: Build
      run: ./tests/test_kernel_build.sh
      shell: bash
    - name: Install
      run: ./tests/test_kernel_install.sh
      shell: bash

  run-kernel-module-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: ./deploy/dependencies/install_dependencies_ubuntu_24_04.sh
      shell: bash
    - name: Test Install
      run: ./tests/test_kernel_install.sh
      shell: bash
    - name: Test Reload First
      run: ./tests/test_kernel_reload.sh
      shell: bash
    - name: Test Reload Second
      run: ./tests/test_kernel_reload.sh
      shell: bash

  run-kernel-dkms-install-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: ./deploy/dependencies/install_dependencies_ubuntu_24_04.sh
      shell: bash
    - name: Build
      run: ./tests/test_kernel_dkms_install.sh
      shell: bash

  run-tests:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Install Development Dependencies
        run: ./deploy/dependencies/install_development_dependencies_ubuntu_24_04.sh
        shell: bash
      - name: Lint with Linux checkpath
        if: always()
        run: ./tests/test_kernel_checkpath.sh
        shell: bash
      - name: Lint with pylint
        if: always()
        run: ./tests/test_python.sh
        shell: bash
      - name: Build legiond
        if: always()
        run: ./tests/test_legiond_build.sh
        shell: bash
      - name: Test python CLI
        if: always()
        run: ./tests/test_python_cli.sh
        shell: bash
      - name: Test python GUI
        if: always()
        run: ./tests/test_python_gui.sh
        shell: bash
      - name: Test python GUI startup
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -p test_gui_startup.py
        shell: bash
      - name: Install python package
        if: always()
        run: sudo ./deploy/python_install_pip_pkg.sh
        shell: bash

  test-in-docker-container:
    # No `needs`: the container builds are self-contained, so start them
    # immediately in parallel with the other jobs to keep wall time low.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build containers and run tests inside them
      # bake keeps the parallel compose targets and adds a persistent
      # GitHub Actions layer cache so unchanged dependency layers
      # (pacman/apt installs) are not rebuilt on every run.
      uses: docker/bake-action@v7
      with:
        source: .
        files: deploy/docker-compose.yaml
        targets: legion-arch,legion-manjaro,legion-ubuntu-24-04
        set: |
          legion-arch.cache-from=type=gha,scope=lll-arch
          legion-arch.cache-to=type=gha,mode=max,scope=lll-arch
          legion-manjaro.cache-from=type=gha,scope=lll-manjaro
          legion-manjaro.cache-to=type=gha,mode=max,scope=lll-manjaro
          legion-ubuntu-24-04.cache-from=type=gha,scope=lll-ubuntu-24-04
          legion-ubuntu-24-04.cache-to=type=gha,mode=max,scope=lll-ubuntu-24-04
